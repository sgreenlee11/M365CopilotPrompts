            for (const city of cities) {
                try {
                    const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&units=imperial&appid=${apiKey}`);

                    const temp = data.main.temp;
                    const humidity = data.main.humidity;
                    const distanceFromComfort = Math.abs(temp - comfortTemp(2, 0.57, 0.447));

                    heatData.push([city.lat, city.lon, distanceFromComfort]);

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${city.name}</td>
                        <td>${city.state}</td>
                        <td>${temp.toFixed(1)}</td>
                        <td>${humidity}</td>
                        <td>${distanceFromComfort.toFixed(1)}</td>

                }

        };
